name: Kotlin Multiplatform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build & Verify Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android Library & Host App
        run: ./gradlew assembleDebug --stacktrace

  build-ios:
    name: Build & Verify iOS
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Xcode Command Line Tools
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Build iOS XCFramework (Debug)
        run: ./gradlew :app-shared:assembleSharedDebugXCFramework --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec app-ios/project.yml

      - name: Build iOS Swift Package / Host App
        run: |
          xcodebuild -project app-ios/app-ios.xcodeproj \
                     -scheme app-ios \
                     -destination "generic/platform=iOS Simulator" \
                     -configuration Debug \
                     clean build
