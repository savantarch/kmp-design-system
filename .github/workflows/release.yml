name: Publish & Release KMP Design System

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Publish & Release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Xcode Command Line Tools
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'


      - name: Build iOS XCFramework
        run: |
          tag_name="${GITHUB_REF##*/}"
          version_number="${tag_name#v}"
          ./gradlew :design-system:assembleDesignSystemReleaseXCFramework \
                    -Pversion="$version_number" \
                    --stacktrace

      - name: Publish Design System and Gradle Plugin
        run: |
          tag_name="${GITHUB_REF##*/}"
          version_number="${tag_name#v}"
          
          # Publish core KMP design-system library to Maven Central via Vanniktech
          ./gradlew :design-system:publishAllPublicationsToMavenCentralRepository \
                    -Pversion="$version_number" \
                    --no-configuration-cache \
                    --stacktrace

          # Publish Gradle plugin to Gradle Plugin Portal
          ./gradlew :design-system-gradle-plugin:publishPlugins \
                    -Pversion="$version_number" \
                    --no-configuration-cache \
                    --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSPHRASE }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}



      - name: Zip iOS XCFramework
        run: |
          cd design-system/build/XCFrameworks/release
          zip -r ../../../../DesignSystem.xcframework.zip DesignSystem.xcframework

      - name: Update Package.swift on Detached Tag (Clean Main)
        run: |
          tag_name="${GITHUB_REF##*/}"
          checksum=$(shasum -a 256 DesignSystem.xcframework.zip | cut -d' ' -f1)
          echo "Computed XCFramework SHA256 Checksum: $checksum"
          
          # Replace placeholder checksum and release URL dynamically using python
          python3 -c "
          import sys
          content = open('Package.swift').read()
          content = content.replace('releases/download/v1.0.0-SNAPSHOT/DesignSystem.xcframework.zip', 'releases/download/${tag_name}/DesignSystem.xcframework.zip')
          content = content.replace('PLACEHOLDER_CHECKSUM', '${checksum}')
          open('Package.swift', 'w').write(content)
          "
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create a detached commit locally (this does not affect the main branch)
          git add Package.swift
          git commit -m "chore: Update Package.swift with binary checksum for release ${tag_name}" || echo "No changes to commit"
          
          # Force-update the local tag to point to this new commit
          git tag -f "${tag_name}"
          
          # Force-push only the tag to the remote repository (main branch remains 100% clean!)
          git push -f origin "${tag_name}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: DesignSystem.xcframework.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
