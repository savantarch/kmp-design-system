name: Deploy API Documentation (KDocs)

on:
  push:
    branches:
      - main

# Ensure only one doc deployment runs at a time
concurrency:
  group: deploy-kdocs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy-docs:
    name: Build & Deploy KDocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate KDocs with Dokka
        run: ./gradlew :design-system:dokkaGenerateHtml --no-configuration-cache --stacktrace

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: design-system/build/dokka/html
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: Deploy updated KDocs to gh-pages [skip ci]'
