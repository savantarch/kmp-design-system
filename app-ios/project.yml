name: app-ios
options:
  bundleIdPrefix: com.savantarch
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  localizations:
    - en
    - es
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  Shared:
    path: Packages/Shared

targets:
  app-ios:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - app-iosTests
    sources:
      - path: App
    preBuildScripts:
      - name: Build shared KMP framework
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          ./gradlew :app-shared:assembleShared${CONFIGURATION}XCFramework
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.savantarch.design-system
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Shared
    postBuildScripts:
      - name: Copy co-located KMP bundle
        script: |
          set -euo pipefail
          BUNDLE_SRC="$SRCROOT/../app-shared/build/ios/resources/design-system.bundle"
          if [ -d "$BUNDLE_SRC" ]; then
            echo "Copying co-located KMP bundle from $BUNDLE_SRC"
            cp -R "$BUNDLE_SRC" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/"
          else
            echo "Warning: KMP bundle not found at $BUNDLE_SRC. Make sure Gradle build ran successfully."
          fi

  app-iosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: app-ios






